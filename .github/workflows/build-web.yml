name: Build AnonGram Web (TypeScript + Vite)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 🌐 Build TypeScript Web Bundle in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: 🔎 Typecheck TypeScript
        working-directory: frontend/web
        run: npm run typecheck

      - name: 🛠️ Build Web Distribution
        working-directory: frontend/web
        run: |
          npm run build
          mkdir -p build/dist/bundle
          cp -r dist/* build/dist/bundle/

          # Обязательно для GitHub Pages: отключаем Jekyll и дублируем 404 для SPA
          touch build/dist/bundle/.nojekyll
          cp build/dist/bundle/index.html build/dist/bundle/404.html

          echo "=== FINAL BUNDLE CONTENTS ==="
          ls -lh build/dist/bundle/

      - name: 📦 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anongram-web-dist
          path: frontend/web/build/dist/bundle/
          retention-days: 14

      - name: ⚙️ Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 🌐 Upload Artifact for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/build/dist/bundle/

  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
