name: Build AnonGram Web (Compose Multiplatform Wasm)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 🌐 Build Compose Wasm Web Bundle in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle & Cloud Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 🛠️ Build Web Distribution
        working-directory: frontend/web
        run: |
          gradle wasmJsBrowserDistribution --stacktrace 2>&1 | tee build_web.log
          mkdir -p build/dist/bundle
          
          # Находим каталог, где лежит скомпилированный index.html
          INDEX_PATH=$(find build -name "index.html" | grep -E "(productionExecutable|developmentExecutable|dist)" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "::error::Compiled index.html not found!"
            exit 1
          fi
          DIST_DIR=$(dirname "$INDEX_PATH")
          echo "Copying web assets from $DIST_DIR to build/dist/bundle/"
          cp -r "$DIST_DIR"/* build/dist/bundle/
          
          # Обязательно для GitHub Pages: отключаем Jekyll и дублируем 404 для SPA
          touch build/dist/bundle/.nojekyll
          cp build/dist/bundle/index.html build/dist/bundle/404.html
          
          echo "=== FINAL BUNDLE CONTENTS ==="
          ls -lh build/dist/bundle/

      - name: 📋 Upload Build Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: frontend/web/build/
          retention-days: 3

      - name: 📦 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anongram-web-wasm-dist
          path: frontend/web/build/dist/bundle/
          retention-days: 14

      - name: ⚙️ Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 🌐 Upload Artifact for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/build/dist/bundle/

  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
