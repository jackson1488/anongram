name: Build AnonGram Web (Compose Multiplatform Wasm)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/web/**"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🌐 Build Compose Wasm Web Bundle in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle & Cloud Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 🛠️ Build Web Distribution (wasmJsBrowserDistribution)
        working-directory: frontend/web
        run: |
          gradle wasmJsBrowserDistribution --stacktrace --info 2>&1 | tee build_web.log

      - name: 📋 Upload Build Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: frontend/web/build_web.log
          retention-days: 3

      - name: 📦 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anongram-web-wasm-dist
          path: frontend/web/build/dist/wasmJs/productionExecutable/
          retention-days: 14
