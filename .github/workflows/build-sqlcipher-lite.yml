name: Build SQLCipher Lite (arm64-v8a, libtomcrypt, no OpenSSL)

on:
  workflow_dispatch:

jobs:
  build-sqlcipher-lite:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tclsh build-essential git libtomcrypt-dev

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Build libtomcrypt (arm64-v8a)
        run: |
          NDK_ROOT="${ANDROID_HOME}/ndk/27.2.12479018"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="${TOOLCHAIN}/bin/aarch64-linux-android28-clang"
          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
          export CFLAGS="-Os -fPIC -ffunction-sections -fdata-sections -DLTC_NO_TEST"

          git clone --depth 1 --branch v1.18.2 https://github.com/libtom/libtomcrypt.git /tmp/libtomcrypt
          cd /tmp/libtomcrypt
          make -j"$(nproc)" library
          ls -lh libtomcrypt.a

      - name: Generate SQLCipher 4.6.1 amalgamation (sqlite3.c)
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/sqlcipher/sqlcipher.git /tmp/sqlcipher
          cd /tmp/sqlcipher
          ./configure --enable-tempstore=yes --with-crypto-lib=libtomcrypt \
            CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_LIBTOMCRYPT -I/tmp/libtomcrypt/src/headers"
          make -j"$(nproc)" sqlite3.c
          ls -lh sqlite3.c sqlite3.h

      - name: Build libsqlcipher.so (arm64-v8a, no OpenSSL)
        run: |
          NDK_ROOT="${ANDROID_HOME}/ndk/27.2.12479018"
          git clone --depth 1 --branch v4.6.1 https://github.com/sqlcipher/sqlcipher-android.git /tmp/sqlcipher-android
          JNI_DIR="/tmp/sqlcipher-android/sqlcipher/src/main/jni"
          cp /tmp/sqlcipher/sqlite3.c /tmp/sqlcipher/sqlite3.h "${JNI_DIR}/sqlcipher/"
          sed -i 's/int rc = strerror_r(errnum, buf, buflen);/const char* msg = strerror_r(errnum, buf, buflen); int rc = (msg == nullptr) ? 1 : 0; if (msg \&\& msg != buf) { snprintf(buf, buflen, "%s", msg); }/' "${JNI_DIR}/sqlcipher/JNIHelp.cpp"

          cat > "${JNI_DIR}/sqlcipher/Android.mk" <<'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)

          LOCAL_CFLAGS += -Os -ffunction-sections -fdata-sections \
            -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_LIBTOMCRYPT -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_FTS3_PARENTHESIS \
            -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS4_UNICODE61 -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_ENABLE_UNLOCK_NOTIFY -DSQLITE_ENABLE_RTREE \
            -DSQLITE_SOUNDEX -DHAVE_USLEEP -DSQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_ENABLE_STAT3 \
            -DSQLITE_ENABLE_STAT4 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_EXPLAIN_COMMENTS \
            -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_MAX_VARIABLE_NUMBER=99999 \
            -DSQLITE_DEFAULT_JOURNAL_SIZE_LIMIT=1048576 -DSQLITE_ENABLE_SESSION \
            -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_DBSTAT_VTAB

          LOCAL_CPPFLAGS += -Os -ffunction-sections -fdata-sections -Wno-conversion-null

          LOCAL_SRC_FILES := \
            android_database_SQLiteCommon.cpp \
            android_database_SQLiteConnection.cpp \
            android_database_SQLiteGlobal.cpp \
            android_database_SQLiteDebug.cpp \
            JNIHelp.cpp JniConstants.cpp sqlite3.c

          LOCAL_C_INCLUDES += $(LOCAL_PATH) $(LOCAL_PATH)/nativehelper/ /tmp/libtomcrypt/src/headers/
          LOCAL_MODULE := libsqlcipher
          LOCAL_LDLIBS += -ldl -llog
          LOCAL_LDFLAGS += -Wl,-z,max-page-size=16384 -Wl,--gc-sections -Wl,--strip-all
          LOCAL_STATIC_LIBRARIES += static-libtomcrypt

          include $(BUILD_SHARED_LIBRARY)

          include $(CLEAR_VARS)
          LOCAL_MODULE := static-libtomcrypt
          LOCAL_SRC_FILES := /tmp/libtomcrypt/libtomcrypt.a
          include $(PREBUILT_STATIC_LIBRARY)
          EOF

          "${NDK_ROOT}/ndk-build" -C "${JNI_DIR}" \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-28 \
            APP_STL=c++_static \
            -j"$(nproc)"

          mkdir -p /tmp/out/arm64-v8a
          cp "/tmp/sqlcipher-android/sqlcipher/src/main/libs/arm64-v8a/libsqlcipher.so" /tmp/out/arm64-v8a/
          "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all /tmp/out/arm64-v8a/libsqlcipher.so
          ls -lh /tmp/out/arm64-v8a/libsqlcipher.so

      - name: Upload libsqlcipher.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-lite-arm64
          path: /tmp/out/arm64-v8a/libsqlcipher.so
          retention-days: 14
