name: Build AnonGram Android APK (Cloud CI)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/android/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Новый пуш отменяет устаревшую сборку: цикл «правка -> APK» максимально короткий.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build Signed APK in Cloud (Zero Local PC Load)
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/anongram-release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Ключ Jackson Storm берётся ТОЛЬКО из секретов. Случайный ключ на лету
      # запрещён: с ним каждый APK имел бы новую подпись, и обновление поверх
      # установленного приложения невозможно.
      - name: 🔑 Restore Jackson Storm Release Keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets RELEASE_KEYSTORE_BASE64 / KEYSTORE_PASSWORD are missing. Refusing to build with a throwaway key."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"

      - name: 🐘 Setup Gradle & Cloud Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 🧠 Cache Bergamot TranslateKit AAR
        id: cache-translate-kit
        uses: actions/cache@v4
        with:
          path: frontend/android/app/libs/translate-kit-release.aar
          key: translate-kit-aar-v0.1.0-arm64-v2

      - name: 🛠️ Build Bergamot TranslateKit AAR (arm64-v8a)
        if: steps.cache-translate-kit.outputs.cache-hit != 'true'
        run: |
          mkdir -p frontend/android/app/libs
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          fi
          rm -rf /tmp/translate-kit
          git clone --depth 1 https://github.com/marcosholgado/translate-kit.git /tmp/translate-kit
          cd /tmp/translate-kit
          git submodule update --init --recursive --depth 1 third_party/cld2
          git submodule update --init --depth 1 third_party/translations
          git -C third_party/translations submodule update --init --recursive --depth 1 \
            inference/3rd_party/ssplit-cpp \
            inference/marian-fork/src/3rd_party/sentencepiece \
            inference/marian-fork/src/3rd_party/intgemm \
            inference/marian-fork/src/3rd_party/ruy \
            inference/marian-fork/src/3rd_party/simd_utils
          bash scripts/apply-engine-patches.sh
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path("android/translate-kit/src/main/java/io/github/marcosholgado/translatekit/TranslateKit.kt")
          src = p.read_text()
          old_field = "    @Volatile\n    private var nativeLibraryUnavailable: Boolean = false"
          new_field = old_field + "\n\n" + textwrap.indent(textwrap.dedent("""\
              @Volatile
              private var nativeLibraryLoaded: Boolean = false

              @Synchronized
              fun loadFromPath(libraryPath: String): Boolean {
                  if (nativeLibraryLoaded) return true
                  return try {
                      System.load(libraryPath)
                      nativeLibraryLoaded = true
                      nativeLibraryUnavailable = false
                      true
                  } catch (e: UnsatisfiedLinkError) {
                      Log.w(TAG, "Failed to load translate-kit from $libraryPath", e)
                      false
                  }
              }"""), "    ")
          assert old_field in src, "field anchor not found"
          src = src.replace(old_field, new_field, 1)
          old_load = textwrap.indent(textwrap.dedent("""\
              try {
                  System.loadLibrary(LIBRARY_NAME)
              } catch (e: UnsatisfiedLinkError) {
                  // No native library for this device's ABI. Degrade gracefully rather
                  // than crashing the host app; translation stays unavailable here.
                  nativeLibraryUnavailable = true
                  Log.w(TAG, "translate-kit native library unavailable for this device's ABI; " +
                      "on-device translation is disabled here", e)
                  return
              }"""), "        ")
          new_load = textwrap.indent(textwrap.dedent("""\
              if (!nativeLibraryLoaded) {
                  try {
                      System.loadLibrary(LIBRARY_NAME)
                      nativeLibraryLoaded = true
                  } catch (e: UnsatisfiedLinkError) {
                      // No native library for this device's ABI. Degrade gracefully rather
                      // than crashing the host app; translation stays unavailable here.
                      nativeLibraryUnavailable = true
                      Log.w(TAG, "translate-kit native library unavailable for this device's ABI; " +
                          "on-device translation is disabled here", e)
                      return
                  }
              }"""), "        ")
          assert old_load in src, "loadLibrary block not found"
          src = src.replace(old_load, new_load, 1)
          p.write_text(src)
          PY
          cd android
          chmod +x gradlew
          ./gradlew :translate-kit:assembleRelease -PtestAbi=arm64-v8a --no-daemon
          cp translate-kit/build/outputs/aar/translate-kit-release.aar "$GITHUB_WORKSPACE/frontend/android/app/libs/translate-kit-release.aar"

      - name: 🧪 Run Unit Tests & Encryption Benchmarks
        working-directory: frontend/android
        run: gradle testDebugUnitTest --console=plain --stacktrace

      - name: 🛠️ Build Signed APK
        working-directory: frontend/android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 🔍 Verify Signed APK & Display Certificate
        working-directory: frontend/android
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found built APK: $APK_FILE"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK_FILE"

      - name: 📦 Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anongram-signed-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
