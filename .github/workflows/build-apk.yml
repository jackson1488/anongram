name: Build AnonGram Android APK (Cloud CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: 🚀 Build Signed APK in Cloud (Zero Local PC Load)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔑 Setup Jackson Storm Release Keystore
        run: |
          mkdir -p frontend/android/app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using master Jackson Storm keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/app/anongram-release.keystore
          else
            echo "Setting up Jackson Storm Bishkek release certificate for cloud build..."
            keytool -genkeypair \
              -keystore frontend/android/app/anongram-release.keystore \
              -alias jackson-storm \
              -keyalg RSA \
              -keysize 4096 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -storetype PKCS12 \
              -dname "CN=Jackson Storm, OU=AnonGram Core Security, O=AnonGram, L=Bishkek, ST=Chuy, C=KG" \
              -storepass "JacksonStormAnonGram2026!" \
              -keypass "JacksonStormAnonGram2026!"
          fi

      - name: 🐘 Setup Gradle & Cloud Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 🛠️ Build Signed APK
        working-directory: frontend/android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            gradle assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 🔍 Verify Signed APK & Display Certificate
        working-directory: frontend/android
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found built APK: $APK_FILE"
          echo "Verifying APK Signature with apksigner..."
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK_FILE" || true

      - name: 📦 Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anongram-signed-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
