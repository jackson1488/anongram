name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/core
      - run: cargo fmt
      - name: Run tests and commit log
        run: |
          cargo test --all -- --nocapture > ../../test_output.txt 2>&1 || FAILED=1
          git config user.name "keneshevkairat07"
          git config user.email "keneshevkairat07@gmail.com"
          git add ../../test_output.txt
          git commit -m "ci: dump cargo test output" || true
          git push origin main || true
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
