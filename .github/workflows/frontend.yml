name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/core
      - run: cargo fmt
      - name: Run tests and save log
        run: |
          cargo test --all -- --nocapture > /tmp/test_output.log 2>&1 || (cp /tmp/test_output.log test_result.log && exit 1)
      - run: cargo clippy --all-targets -- -D warnings
      - name: Report test results
        if: always()
        run: |
          if [ -f /tmp/test_output.log ]; then
            echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
