name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/core
      - run: cargo fmt
      - name: Run tests and save log
        run: |
          cargo test --all -- --nocapture > /tmp/test_output.log 2>&1 || (cp /tmp/test_output.log test_result.log && exit 1)
      - run: cargo clippy --all-targets -- -D warnings
      - name: Save failed log
        if: failure()
        run: |
          git config user.name "keneshevkairat07"
          git config user.email "keneshevkairat07@gmail.com"
          git checkout -B test-log-branch
          git add test_result.log || true
          git commit -m "ci: test failures log" || true
          git push -f origin test-log-branch || true
