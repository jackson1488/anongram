name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/core
      - name: Format code
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "keneshevkairat07"
            git config user.email "keneshevkairat07@gmail.com"
            git add -A
            git commit -m "style: apply rustfmt formatting"
            git push origin main
          fi
      - name: Run Clippy
        run: |
          cargo clippy --all-targets -- -D warnings || (cargo clippy --all-targets -- -D warnings > ../../clippy_err.txt 2>&1 || true; git config user.name "keneshevkairat07"; git config user.email "keneshevkairat07@gmail.com"; git add ../../clippy_err.txt; git commit -m "ci: dump workspace clippy err" || true; git push origin main || true; exit 1)
      - run: cargo test --all -- --nocapture
