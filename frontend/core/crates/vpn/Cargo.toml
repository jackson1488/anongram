[package]
name = "vpn"
version = "0.1.0"
edition = "2021"
description = "Multi-Protocol Anti-Censorship VPN Engine: AmneziaWG, Shadowsocks 2022, VLESS-Reality"

[dependencies]
crypto = { path = "../crypto" }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
