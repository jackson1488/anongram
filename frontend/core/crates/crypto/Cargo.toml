[package]
name = "crypto"
version = "0.1.0"
edition = "2021"
description = "Pure Post-Quantum and Authenticated Cryptography"

[dependencies]
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.2"
ed25519-dalek = "2"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
