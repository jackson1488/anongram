[package]
name = "anongram_core"
version = "0.1.0"
edition = "2021"
description = "AnonGram core: hybrid PQ crypto, one-time pad, passport blob"
license = "MIT"

[lib]
name = "anongram_core"
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.2"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
