[package]
name = "anongram_core"
version = "0.1.0"
edition = "2021"
description = "AnonGram Unified Modular Core Facade"
license = "MIT"

[workspace]
members = [
    "crates/crypto",
    "crates/otp",
    "crates/media",
    "crates/identity",
    "crates/vpn",
]

[lib]
name = "anongram_core"
path = "src/lib.rs"

[dependencies]
crypto = { path = "crates/crypto" }
otp = { path = "crates/otp" }
media = { path = "crates/media" }
identity = { path = "crates/identity" }
vpn = { path = "crates/vpn" }
thiserror = "1"
